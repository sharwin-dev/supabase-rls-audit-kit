name: RLS Audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  rls-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install audit tool
        run: npm install --save-dev supabase-rls-audit-kit

      - name: Run RLS audit
        run: npx rls-audit --database-url "$SUPABASE_DATABASE_URL" --format json > rls-audit-report.json
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-audit-report
          path: rls-audit-report.json
